name: Publish 均匀分赃
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build portable HTML
        run: python3 build.py
      - name: Verify allocation invariants
        run: npm ci --ignore-scripts && npm test
      - name: Verify committed artifact
        run: git diff --exit-code -- index.html local.html
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p dist/assets
          cp index.html dist/index.html
          cp local.html dist/local.html
          cp assets/yy-round-v6.png dist/assets/yy-round-v6.png
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
